services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: pgvector_db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: books_db
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck: # <-- ДОБАВЬТЕ ЭТОТ БЛОК
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d books_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  app:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: Dockerfile
    container_name: java_app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/books_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      SERVER_PORT: 8080
      SPRING_AI_MISTRALAI_EMBEDDING_BASE_URL: http://host.docker.internal:8082
      SPRING_AI_MISTRALAI_EMBEDDING_API_KEY: dummy-key
      SPRING_AI_MISTRALAI_EMBEDDING_OPTIONS_MODEL: qwen3-embedding-0.6b-q4_k_m
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    volumes:
      - ./logs:/app/logs

networks:
  app-network:
    driver: bridge