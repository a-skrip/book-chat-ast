version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg17  # Используем официальный образ с pgvector
    container_name: pgvector_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: books_db
    ports:
      - "5433:5432"  # Пробрасываем порт на хост
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Сохраняем данные
    restart: unless-stopped

volumes:
  postgres_data: