server:
  port: 8088

spring:
  application:
    name: book-chat

  ai:
    mistralai:
      base-url: https://api.mistral.ai
      api-key: ${MISTRAL_API_KEY}
      chat:
        options:
          model: mistral-large-latest
          temperature: 0.2
          max-tokens: 256
      embedding:
        base-url: https://api.mistral.ai
        api-key: ${MISTRAL_API_KEY}

        options:
          model: mistral-embed-2312
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1024  # Размерность
        index-type: HNSW
        distance-type: COSINE_DISTANCE    # Для индексации: "search_document: "

  datasource:
    url: jdbc:postgresql://localhost:5433/books_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: db/changelog/db.changelog-master.sql
    enabled: true

springdoc:
  api-docs:
    enabled: true

