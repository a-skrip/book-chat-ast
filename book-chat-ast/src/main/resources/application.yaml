server:
  port: 8088

spring:
  application:
    name: book-chat

  ai:
    openai:
      base-url: https://api.mistral.ai
      api-key: ${MISTRAL_API_KEY}
      chat:
        options:
          model: mistral-large-latest
          temperature: 0.5
          max-tokens: 256
      # Эмбеддинги — локальный llama.cpp

      embedding:
        base-url: http://localhost:8082
        api-key: dummy-key
        options:
          dimensions: 1024
          model: Qwen3-Embedding-0.6B-f16
