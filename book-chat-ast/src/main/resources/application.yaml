server:
  port: 8088

yandex:
  base-url: ${YANDEX_BASE_URL}
  api-key: ${YANDEX_API_KEY}
  folder: ${YANDEX_FOLDER}
  model: ${YANDEX_MODEL}

embedding:
  base-url: http://localhost:8082
  api-key: dummy-key

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: book-chat

  ai:
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1024  # Размерность
        index-type: HNSW
        distance-type: COSINE_DISTANCE    # Для индексации: "search_document: "

  datasource:
    url: jdbc:postgresql://localhost:5433/books_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: db/changelog/db.changelog-master.sql
    enabled: true

springdoc:
  api-docs:
    enabled: true

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000}  # 24 часа в миллисекундах

