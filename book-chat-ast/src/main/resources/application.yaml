    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1024  # Размерность
        index-type: HNSW
        distance-type: COSINE_DISTANCE    # Для индексации: "search_document: "

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: db/changelog/db.changelog-master.sql
    enabled: true